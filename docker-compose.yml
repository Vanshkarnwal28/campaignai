version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campaignai-postgres
    environment:
      POSTGRES_DB: campaignai_db
      POSTGRES_USER: campaignai_user
      POSTGRES_PASSWORD: campaignai_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: campaignai-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  redisdata:
